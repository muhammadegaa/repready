<title>Scenario Labeling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Progress and scenario chips on top, one scenario card below, tabs switch to rule review. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#14181f; --muted:#5a6472; --line:#dde1e7;
  --accent:#0b6e8a; --good:#1a7f4b; --warn:#a15c00; --bad:#b3261e; --chip:#e8eef3;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#171c23; --fg:#e8ecf1; --muted:#9aa5b3; --line:#2a323c;
    --accent:#4cb8d6; --good:#4cc38a; --warn:#e0a240; --bad:#f0756c; --chip:#1f2730; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --fg:#e8ecf1; --muted:#9aa5b3; --line:#2a323c;
  --accent:#4cb8d6; --good:#4cc38a; --warn:#e0a240; --bad:#f0756c; --chip:#1f2730; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:900px;margin-inline:auto}
h1{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:28px 0 8px;letter-spacing:-0.01em;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px} h3{font-size:14px;margin:18px 0 8px}
p{margin:0 0 10px;max-width:68ch}
.meta{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lede{color:var(--muted);max-width:64ch}
.banner{border-left:3px solid var(--warn);background:var(--surface);padding:8px 12px;margin:12px 0}
.tabs{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.tabs button,.chip,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px}
.tabs button{padding:7px 14px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin:6px 0 14px}
.bar>div{height:100%;background:var(--good);width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-family:var(--font-mono);font-size:12px;padding:5px 9px}
.chip[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px}
.chip.s-decision{border-color:var(--warn);color:var(--warn)}
.chip.s-done{border-color:var(--good);color:var(--good);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--chip)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.today td{font-weight:600}
.flag{color:var(--bad);font-weight:500}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
select,input[type=number],input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
input[type=number]{width:84px}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px}
.btn{padding:8px 16px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--fg);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.ok{color:var(--good);font-size:13px}
.hint{color:var(--muted);font-size:12.5px}
.rules label.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0}
.rules input[type=checkbox]{margin-top:4px}
.locked{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;color:var(--muted);font-size:13px}
.rule-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.rule-card .id{font-family:var(--font-mono);color:var(--accent);font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<script id="data" type="application/json">__DATA__</script>
<div class="wrap">
  <p class="meta" style="margin-top:24px">adaptive-sc · expert labeling</p>
  <h1>Scenario labeling</h1>
  <p class="lede">For each fictional athlete, write what you would do with today's planned session. Your decisions are the ground truth the agent is scored against, so use your own judgement and save the decision before opening the rule notes.</p>
  <div id="banner"></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-scn" aria-selected="true">Scenarios</button>
    <button role="tab" id="tab-rules" aria-selected="false">Rule review</button>
    <button role="tab" id="tab-help" aria-selected="false">How to label</button>
  </div>
  <div id="view"></div>
</div>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var DECISIONS = [
    ['none','No change'],['reduce','Reduce volume or load'],['swap','Swap an exercise'],
    ['rest','Rest day (illness)'],['flag_only','Flag to coach, no edit'],['increase','Suggest an increase (flag only)']
  ];
  var db = null, uid = null, dbState = 'connecting';
  var labels = {}, rules = {}, current = DATA.scenarios[0].id, tab = 'scn';
  var saving = {};

  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function byId(id){ return document.getElementById(id); }
  function scn(id){ return DATA.scenarios.filter(function(s){ return s.id === id; })[0]; }
  function status(id){ var l = labels[id]; if(!l || !l.decision) return ''; return l.rules_saved ? 's-done' : 's-decision'; }
  function banner(msg){ byId('banner').innerHTML = msg ? '<div class="banner">' + esc(msg) + '</div>' : ''; }

  function setTab(t){
    tab = t;
    ['scn','rules','help'].forEach(function(k){ byId('tab-'+k).setAttribute('aria-selected', String(k === t)); });
    render();
  }
  byId('tab-scn').onclick = function(){ setTab('scn'); };
  byId('tab-rules').onclick = function(){ setTab('rules'); };
  byId('tab-help').onclick = function(){ setTab('help'); };

  function progressHtml(){
    var n = DATA.scenarios.length, d = 0, r = 0;
    DATA.scenarios.forEach(function(s){ var l = labels[s.id]; if(l && l.decision){ d++; if(l.rules_saved) r++; } });
    return '<div class="meta">Decisions saved: ' + d + ' of ' + n + ' · Rules tagged: ' + r + ' of ' + n + '</div>' +
      '<div class="bar" aria-hidden="true"><div style="width:' + Math.round(100 * d / n) + '%"></div></div>';
  }
  function chipsHtml(){
    return '<div class="chips">' + DATA.scenarios.map(function(s){
      return '<button class="chip ' + status(s.id) + '" data-id="' + s.id + '"' + (s.id === current ? ' aria-current="true"' : '') + '>' + s.id + '</button>';
    }).join('') + '</div>';
  }

  function scenarioHtml(s){
    var p = s.planned_session;
    var ex = p.exercises.map(function(e){
      return '<tr><td>' + esc(e.name) + '</td><td class="num">' + e.sets + '</td><td class="num">' + e.reps + '</td><td>' + esc(e.load) + '</td><td class="num">' + (e.target_rpe == null ? '' : e.target_rpe) + '</td></tr>';
    }).join('');
    var days = s.last_14_days.map(function(d){
      var so = d.soreness.overall + (Object.keys(d.soreness.by_region).length ? ' (' + Object.keys(d.soreness.by_region).map(function(k){ return esc(k) + ' ' + d.soreness.by_region[k]; }).join(', ') + ')' : '');
      var rp = d.session ? (d.session.rpe_delta > 0 ? '+' + d.session.rpe_delta : String(d.session.rpe_delta)) : '–';
      return '<tr class="' + (d.day === 0 ? 'today' : '') + '"><td class="num">' + (d.day === 0 ? 'today' : d.day) + '</td><td class="num">' + d.sleep_h + '</td><td>' + so + '</td><td class="num">' + d.stress + '</td><td class="num">' + rp + '</td><td>' + (d.note ? '<span class="flag">' + esc(d.note) + '</span>' : '') + '</td></tr>';
    }).join('');
    var a = s.athlete;
    return '<div class="card"><h2>' + s.id + ' · ' + esc(a.sport) + '</h2>' +
      '<p class="hint">' + esc(a.level) + ', ' + a.training_age_years + ' years training, ' + esc(a.age_group) + '. Session: ' + esc(p.label) + (p.week_type === 'deload' ? ' (deload week)' : '') + '.</p>' +
      '<h3>Planned session</h3><div class="scroll"><table><thead><tr><th>Exercise</th><th class="num">Sets</th><th class="num">Reps</th><th>Load</th><th class="num">Target RPE</th></tr></thead><tbody>' + ex + '</tbody></table></div>' +
      '<h3>Last 14 days</h3><div class="scroll"><table><thead><tr><th class="num">Day</th><th class="num">Sleep h</th><th>Soreness 0-10</th><th class="num">Stress 0-10</th><th class="num">RPE vs target</th><th>Note</th></tr></thead><tbody>' + days + '</tbody></table></div>' +
      '<p class="hint" style="margin-top:8px">RPE vs target: session RPE minus the target RPE. A dash means no session that day.</p></div>';
  }

  function formHtml(s){
    var l = labels[s.id] || {};
    var opts = DECISIONS.map(function(d){ return '<option value="' + d[0] + '"' + (l.decision === d[0] ? ' selected' : '') + '>' + d[1] + '</option>'; }).join('');
    var edits = {}; (l.edits || []).forEach(function(e){ edits[e.exercise] = e; });
    var rows = s.planned_session.exercises.map(function(e, i){
      var x = edits[e.name] || {};
      return '<tr><td>' + esc(e.name) + '</td>' +
        '<td><input type="number" id="f-sets-' + i + '" min="1" max="' + e.sets + '" placeholder="' + e.sets + '" value="' + (x.sets != null ? x.sets : '') + '" aria-label="Sets for ' + esc(e.name) + '"></td>' +
        '<td><input type="number" id="f-reps-' + i + '" min="1" max="' + e.reps + '" placeholder="' + e.reps + '" value="' + (x.reps != null ? x.reps : '') + '" aria-label="Reps for ' + esc(e.name) + '"></td>' +
        '<td><input type="number" id="f-load-' + i + '" min="75" max="100" placeholder="100" value="' + (x.load_pct != null ? x.load_pct : '') + '" aria-label="Load percent of plan for ' + esc(e.name) + '"></td>' +
        '<td><input type="text" id="f-swap-' + i + '" placeholder="swap to" value="' + esc(x.swap_to || '') + '" aria-label="Swap ' + esc(e.name) + ' to"></td></tr>';
    }).join('');
    var busy = saving[s.id] ? ' disabled' : '';
    return '<div class="card"><h2>Your decision</h2>' +
      '<label for="f-decision">Decision</label><select id="f-decision"><option value="">Choose</option>' + opts + '</select>' +
      '<h3>Edits (only for Reduce or Swap)</h3>' +
      '<p class="hint">Leave a box empty for no change. Sets and reps can only go down, and sets × reps cannot fall below 75% of the plan. Load is percent of the planned load, 75 to 100. The product enforces the same limits, so pick the nearest allowed edit and say so in your reason.</p>' +
      '<div class="scroll"><table style="min-width:560px"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Load % of plan</th><th>Swap to</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<label for="f-reason">Reason, one sentence that cites the inputs</label><textarea id="f-reason">' + esc(l.reason || '') + '</textarea>' +
      '<div class="row"><button class="btn" id="f-save"' + busy + '>Save decision</button><span id="f-msg" class="hint"></span></div>' +
      '<div id="f-err" class="err"></div></div>' + rulesPickHtml(s, l);
  }

  function rulesPickHtml(s, l){
    if(!l.decision){
      return '<div class="locked">Rule notes unlock after you save a decision for this scenario, so the rule text cannot steer it.</div>';
    }
    var applied = l.rules_applied || [];
    var list = DATA.rules.map(function(r){
      var ov = rules[r.id] || {};
      var name = ov.name || r.name;
      return '<label class="check"><input type="checkbox" id="r-' + r.id + '" value="' + r.id + '"' + (applied.indexOf(r.id) >= 0 ? ' checked' : '') + '><span><strong>' + r.id + '</strong> ' + esc(name) + '</span></label>';
    }).join('');
    return '<div class="card rules"><h2>Which rules explain your decision?</h2><p class="hint">Tick every rule you used. Tick none if the decision comes from something the rule set lacks, and describe it in the box below.</p>' + list +
      '<label for="f-other">Anything the rules do not cover</label><textarea id="f-other">' + esc(l.other_rule || '') + '</textarea>' +
      '<div class="row"><button class="btn" id="r-save"' + (saving[s.id] ? ' disabled' : '') + '>Save rules</button><span id="r-msg" class="hint"></span></div></div>';
  }

  function num(id){ var v = byId(id).value.trim(); return v === '' ? null : Number(v); }

  function readForm(s){
    var decision = byId('f-decision').value, reason = byId('f-reason').value.trim(), edits = [], err = '';
    if(!decision) return {err: 'Choose a decision.'};
    if(!reason) return {err: 'Write a one-sentence reason.'};
    if(decision === 'reduce' || decision === 'swap'){
      s.planned_session.exercises.forEach(function(e, i){
        var sets = num('f-sets-'+i), reps = num('f-reps-'+i), load = num('f-load-'+i), swap = byId('f-swap-'+i).value.trim();
        if(sets == null && reps == null && load == null && !swap) return;
        var ns = sets == null ? e.sets : sets, nr = reps == null ? e.reps : reps;
        if(!Number.isInteger(ns) || !Number.isInteger(nr) || ns < 1 || nr < 1) err = e.name + ': sets and reps must be whole numbers of at least 1.';
        else if(ns > e.sets || nr > e.reps) err = e.name + ': sets and reps cannot go above the plan.';
        else if((ns * nr) / (e.sets * e.reps) < 0.75) err = e.name + ': sets × reps cannot fall below 75% of the plan.';
        else if(load != null && (load < 75 || load > 100)) err = e.name + ': load must be 75 to 100 percent of plan.';
        var rec = {exercise: e.name};
        if(sets != null) rec.sets = sets; if(reps != null) rec.reps = reps; if(load != null) rec.load_pct = load; if(swap) rec.swap_to = swap;
        edits.push(rec);
      });
      if(!err && decision === 'reduce' && !edits.length) err = 'Reduce needs at least one edit. Choose "No change" if nothing should change.';
      if(!err && decision === 'swap' && !edits.some(function(e){ return e.swap_to; })) err = 'Swap needs at least one "Swap to" exercise.';
    } else {
      edits = [];
    }
    return err ? {err: err} : {decision: decision, reason: reason, edits: edits};
  }

  async function saveDecision(s){
    if(!db){ byId('f-err').textContent = 'Saving is not available in this view.'; return; }
    var f = readForm(s);
    if(f.err){ byId('f-err').textContent = f.err; return; }
    byId('f-err').textContent = '';
    saving[s.id] = true; byId('f-save').disabled = true;
    var prev = labels[s.id] || {};
    var body = {decision: f.decision, reason: f.reason, edits: f.edits, rules_applied: prev.rules_applied || [], other_rule: prev.other_rule || '', rules_saved: !!prev.rules_saved, updatedAt: new Date().toISOString(), by: uid || null};
    try{
      await db.doc('labels/' + s.id).set(body);
      labels[s.id] = body; saving[s.id] = false; render(); byId('f-msg').textContent = ''; byId('f-msg').className = 'ok'; byId('f-msg').textContent = 'Saved.';
    }catch(e){
      saving[s.id] = false; byId('f-save').disabled = false;
      byId('f-err').textContent = 'Could not save (' + (e && e.code ? e.code : 'error') + '). If this says invalid_argument, you may need Contributor access.';
    }
  }

  async function saveRules(s){
    if(!db) return;
    var applied = DATA.rules.filter(function(r){ return byId('r-' + r.id).checked; }).map(function(r){ return r.id; });
    var other = byId('f-other').value.trim();
    if(!applied.length && !other){ byId('r-msg').className = 'err'; byId('r-msg').textContent = 'Tick a rule or describe what else applies.'; return; }
    saving[s.id] = true; byId('r-save').disabled = true;
    var body = Object.assign({}, labels[s.id], {rules_applied: applied, other_rule: other, rules_saved: true, updatedAt: new Date().toISOString()});
    try{
      await db.doc('labels/' + s.id).set(body);
      labels[s.id] = body; saving[s.id] = false;
      var i = DATA.scenarios.findIndex(function(x){ return x.id === s.id; });
      if(i < DATA.scenarios.length - 1) current = DATA.scenarios[i + 1].id;
      render();
    }catch(e){
      saving[s.id] = false; byId('r-save').disabled = false;
      byId('r-msg').className = 'err'; byId('r-msg').textContent = 'Could not save (' + (e && e.code ? e.code : 'error') + ').';
    }
  }

  function renderScenarios(){
    var s = scn(current);
    byId('view').innerHTML = progressHtml() + chipsHtml() + scenarioHtml(s) + formHtml(s);
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){ c.onclick = function(){ current = c.getAttribute('data-id'); render(); window.scrollTo(0, 0); }; });
    byId('f-save').onclick = function(){ saveDecision(s); };
    var rs = byId('r-save'); if(rs) rs.onclick = function(){ saveRules(s); };
  }

  function renderRules(){
    var html = '<p class="lede">These ten rules are placeholders drafted by Claude. Keep, change or delete each one, and add the citation that supports it. Nothing here is validated.</p>';
    html += DATA.rules.map(function(r){
      var o = rules[r.id] || {};
      var trig = o.trigger != null ? o.trigger : r.trigger, act = o.action != null ? o.action : r.action, ev = o.evidence != null ? o.evidence : '', keep = o.keep || '';
      var ko = [['','Not reviewed'],['keep','Keep'],['change','Change (edited below)'],['delete','Delete']].map(function(k){ return '<option value="' + k[0] + '"' + (keep === k[0] ? ' selected' : '') + '>' + k[1] + '</option>'; }).join('');
      return '<div class="rule-card"><span class="id">' + r.id + '</span> <strong>' + esc(r.name) + '</strong>' +
        '<label for="k-' + r.id + '">Verdict</label><select id="k-' + r.id + '">' + ko + '</select>' +
        '<label for="t-' + r.id + '">Trigger</label><textarea id="t-' + r.id + '">' + esc(trig) + '</textarea>' +
        '<label for="a-' + r.id + '">Action</label><textarea id="a-' + r.id + '">' + esc(act) + '</textarea>' +
        '<label for="e-' + r.id + '">Evidence (citation)</label><textarea id="e-' + r.id + '">' + esc(ev) + '</textarea>' +
        '<div class="row"><button class="btn ghost" data-rule="' + r.id + '">Save rule ' + r.id + '</button><span class="hint" id="m-' + r.id + '"></span></div></div>';
    }).join('');
    byId('view').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-rule]'), function(b){
      b.onclick = async function(){
        var id = b.getAttribute('data-rule'), m = byId('m-' + id);
        if(!db){ m.textContent = 'Saving is not available in this view.'; return; }
        var body = {keep: byId('k-'+id).value, trigger: byId('t-'+id).value, action: byId('a-'+id).value, evidence: byId('e-'+id).value, updatedAt: new Date().toISOString(), by: uid || null};
        b.disabled = true;
        try{ await db.doc('rules/' + id).set(body); rules[id] = body; m.className = 'ok'; m.textContent = 'Saved.'; }
        catch(e){ m.className = 'err'; m.textContent = 'Could not save (' + (e && e.code ? e.code : 'error') + ').'; }
        b.disabled = false;
      };
    });
  }

  function renderHelp(){
    byId('view').innerHTML = '<div class="card"><h2>How to label</h2>' +
      '<p>1. Read the planned session and the last 14 days. Decide what you would do as the coach.</p>' +
      '<p>2. Choose a decision, fill in any edits, write a one-sentence reason, and save. Write your decision before you read any rule text.</p>' +
      '<p>3. After saving, the rule list unlocks. Tick the rules that explain your decision, or describe what the rules miss.</p>' +
      '<p>4. Include "No change" cases. Normal fluctuation is a valid answer, and the agent is scored on it.</p>' +
      '<p>5. The athletes are fictional and the numbers are plausible, not measured. If a scenario is unrealistic, say so in the reason.</p>' +
      '<p>6. In the Rule review tab, keep, change or delete each candidate rule and add the citation that supports it. Do this last.</p>' +
      '<p class="hint">Your labels save to a shared store as you go and survive closing the page. Budget about 10 to 15 minutes per scenario.</p></div>';
  }

  function render(){
    if(tab === 'scn') renderScenarios(); else if(tab === 'rules') renderRules(); else renderHelp();
  }

  function refreshChrome(){
    if(tab !== 'scn') return;
    // Replace progress and chips only, so text typed in the form is not overwritten.
    var holder = document.createElement('div'); holder.innerHTML = progressHtml() + chipsHtml();
    var view = byId('view');
    var first = view.querySelector('.meta'), chips = view.querySelector('.chips'), bar = view.querySelector('.bar');
    if(first && chips && bar){
      first.outerHTML = holder.children[0].outerHTML; bar.outerHTML = holder.children[1].outerHTML; chips.outerHTML = holder.children[2].outerHTML;
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){ c.onclick = function(){ current = c.getAttribute('data-id'); render(); window.scrollTo(0, 0); }; });
    }
  }

  render();
  banner('Connecting to the shared store…');
  (async function(){
    try{
      var user = await claude.use('user'); db = await claude.use('db');
      if(user && user.id){ try{ uid = await user.id(); }catch(e){} }
    }catch(e){ db = null; }
    if(!db){ banner('Saving is not available in this view. You can read the scenarios, but labels will not be kept. Open the link signed in to claude.ai.'); return; }
    banner('');
    var first = true;
    db.collection('labels').onSnapshot(function(snap){
      var next = {}; snap.docs.forEach(function(d){ next[d.id] = d.data(); });
      labels = next;
      if(first){ first = false; render(); } else refreshChrome();
    }, function(e){ banner('Live updates stopped (' + (e && e.code ? e.code : 'error') + '). Reload the page.'); });
    db.collection('rules').onSnapshot(function(snap){
      var next = {}; snap.docs.forEach(function(d){ next[d.id] = d.data(); });
      rules = next; if(tab === 'rules' && !document.activeElement.closest('.rule-card')) renderRules();
    }, function(){});
  })();
})();
</script>
