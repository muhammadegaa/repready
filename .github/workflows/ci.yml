name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # A clean, lockfile-exact install: catches a dependency that is used but missing from package.json or the lockfile.
      - run: npm ci
      - name: Dependency audit (high and critical only)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  emulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Firestore tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project repready-7dacd --config ../firebase.json "npx vitest run"
      - name: Browser tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project repready-7dacd --config ../firebase.json "npx playwright test"
      - name: Payment gate test
        env:
          NEXT_PUBLIC_PAYMENT_LINK: https://buy.stripe.test/e2e
          E2E_PORT: "3120"
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project repready-7dacd --config ../firebase.json "npx playwright test e2e/gate.spec.ts"
      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: app/test-results/
          if-no-files-found: ignore
